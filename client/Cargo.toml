[package]
name = "qmon-client"
version.workspace = true
edition.workspace = true

[lib]
name = "questmon"
crate-type = ["cdylib", "rlib"]

[dependencies]
glam = "0.30"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
qmon-proto = { path = "../proto" }
openxr = { version = "0.22", features = ["loaded"] }
android-activity = { version = "0.6", features = ["native-activity"] }
ndk = { version = "0.9", features = ["media", "api-level-29"] }
ndk-context = "0.1"
jni = "0.21"
khronos-egl = { version = "6", features = ["static", "no-pkg-config"] }
anyhow = "1"
android_logger = "0.15"
