[package]
name = "prostir-client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Prostir client for Meta Quest 3 and 3S: virtual monitors as OpenXR compositor layers"

[features]
# Meta Horizon Store build: the store's entitlement check through the Meta Platform
# SDK, loaded at run time (scripts/build-apk.sh with PROSTIR_STORE=1).
store = []

[lib]
name = "prostir"
crate-type = ["cdylib", "rlib"]

[dependencies]
prostir-proto = { path = "../proto" }
glam = "0.30"
log = "0.4"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
fontdue = "0.9"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
openxr = { version = "0.22", features = ["loaded"] }
android-activity = { version = "0.6", features = ["native-activity"] }
ndk = { version = "0.9", features = ["media", "api-level-29"] }
ndk-context = "0.1"
ndk-sys = { version = "0.6", features = ["audio"] }
jni = "0.21"
khronos-egl = { version = "6", features = ["static", "no-pkg-config"] }
anyhow = "1"
android_logger = "0.15"
glow = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
tiny-skia = { version = "0.12", features = ["png-format"] }
