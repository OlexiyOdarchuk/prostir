[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Prostir contributors"]
repository = "https://github.com/OlexiyOdarchuk/prostir"
homepage = "https://prostir.ishawyha.dev"
rust-version = "1.96"

# Our own crates and the dependencies more than one crate uses: their versions in one
# place. A crate adds the features only it needs (`x = { workspace = true, features
# = [...] }`); a dependency of one crate only stays in that crate's Cargo.toml.
[workspace.dependencies]
prostir-proto = { path = "crates/proto" }
prostir-layout = { path = "crates/layout" }
prostir-api = { path = "crates/api" }
prostir-lang = { path = "crates/lang" }
prostir-settings = { path = "crates/settings" }
prostir-testkit = { path = "crates/testkit" }
anyhow = "1"
env_logger = "0.11"
glam = "0.30"
libc = "0.2"
log = "0.4"
serde = "1"
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

# Our own code lightly optimised in debug builds (still quick to build, with debug
# assertions), the dependencies fully: they build once, and GStreamer's bindings,
# egui and the encryption are much faster so.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The layout math's tests check its invariants over thousands of arrangements:
# optimised in debug builds too, so `cargo test --workspace` stays quick.
[profile.dev.package.prostir-layout]
opt-level = 3

# One codegen unit: a smaller and slightly faster program for a longer build. Strip:
# no debug information and no symbol table in what ships, as the packages already had
# no debug information (they stripped it); a panic still names its file and line,
# which come from the panic's location and not from debug information. Distribution
# builds that make their own debug packages (OBS, AUR) ask for line tables back.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
