[workspace]
resolver = "2"
members = ["proto", "layout", "host", "client", "testkit"]
default-members = ["proto", "layout", "host", "client", "testkit"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Prostir contributors"]
repository = "https://github.com/OlexiyOdarchuk/prostir"
homepage = "https://prostir.ishawyha.dev"
rust-version = "1.90"

[profile.release]
lto = "thin"
debug = 1
