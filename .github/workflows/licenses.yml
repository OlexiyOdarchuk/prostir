name: Licenses

# Every dependency must ship a license text the release can include: checked when
# the dependencies change.
on:
  push:
    branches: [main, "dev/**"]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "*/Cargo.toml"
      - "scripts/third-party-licenses.py"
      - ".github/workflows/licenses.yml"
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "*/Cargo.toml"
      - "scripts/third-party-licenses.py"
      - ".github/workflows/licenses.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - name: Third-party licenses
        run: python3 scripts/third-party-licenses.py -o "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt"
