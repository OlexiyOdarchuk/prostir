name: CI PC

# The PC part (the program and its settings window) and the shared protocol, when
# either changed.
on:
  push:
    branches: [main, "dev/**"]
    paths:
      - "host/**"
      - "proto/**"
      - "layout/**"
      - "testkit/**"
      - "lang/**"
      - "settings/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-pc.yml"
      - ".github/actions/**"
  pull_request:
    paths:
      - "host/**"
      - "proto/**"
      - "layout/**"
      - "testkit/**"
      - "lang/**"
      - "settings/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-pc.yml"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pc:
    runs-on: ubuntu-24.04
    # A stuck mirror or runner fails the job instead of holding it for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Plugins for the end-to-end tests: the runner has no graphics card, so they encode
      # with x264 (plugins-ugly); h264parse comes from plugins-bad.
      - uses: ./.github/actions/system-libraries
        with:
          packages: >-
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev pkg-config
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
            gstreamer1.0-plugins-ugly
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt -p prostir-host -p prostir-proto -p prostir-layout -p prostir-testkit -p prostir-lang -p prostir-settings --check
      - run: cargo clippy -p prostir-host -p prostir-proto -p prostir-layout -p prostir-testkit -p prostir-lang -p prostir-settings --all-targets -- -D warnings
      - run: cargo test -p prostir-host -p prostir-proto -p prostir-layout -p prostir-testkit -p prostir-lang
      # The settings window without its pictures: those need a graphics card (or
      # lavapipe), which the runner does not have.
      - run: cargo test -p prostir-settings --lib --test texts
      # The PC app with the fake desktop, driven by a fake headset (host/tests/e2e).
      - name: Clippy with the fake desktop
        run: cargo clippy -p prostir-host --features fake-desktop --all-targets -- -D warnings
      - name: End-to-end tests
        run: cargo e2e
