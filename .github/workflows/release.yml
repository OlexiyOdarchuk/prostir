name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      # Optional release key: repository secrets ANDROID_KEYSTORE (base64),
      # ANDROID_KEYSTORE_PASS and ANDROID_KEY_ALIAS. Without them the APK is
      # signed with a throwaway debug key.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # GoatCounter key for counting users (see host/src/usage.rs). Without it
          # the build never counts.
          PROSTIR_COUNT_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          [ -n "$KEYSTORE_PASS" ] || unset KEYSTORE_PASS
          [ -n "$KEY_ALIAS" ] || unset KEY_ALIAS
          ./scripts/package-release.sh
      - name: Debian and RPM packages
        run: |
          cargo install --locked cargo-deb cargo-generate-rpm
          cargo deb -p prostir-host --no-build -o dist/
          cargo generate-rpm -p host -o dist/
          (cd dist && sha256sum *.tar.gz *.apk *.deb *.rpm > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.tar.gz
            dist/*.apk
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
