name: CI

on:
  push:
  pull_request:

jobs:
  pc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  quest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy for the headset
        run: |
          TC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android32-clang"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android32-clang"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          cargo clippy -p prostir-client --target aarch64-linux-android -- -D warnings
      - name: Build the APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: ./scripts/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: prostir-apk
          path: build/prostir.apk
