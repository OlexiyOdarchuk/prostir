name: CI

# Only code: the site, plans and texts need no build.
on:
  push:
    branches: [main, "dev/**"]
    paths:
      - "host/**"
      - "proto/**"
      - "client/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/third-party-licenses.py"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "host/**"
      - "proto/**"
      - "client/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/third-party-licenses.py"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pc:
    runs-on: ubuntu-24.04
    # A stuck mirror or runner fails the job instead of holding it for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: System libraries
        run: |
          # The runner image's package lists are usually fresh enough: update them
          # only when installing without that fails (it is the slow, flaky part).
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          pkgs="libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev pkg-config"
          $apt install -y --no-install-recommends $pkgs || { $apt update && $apt install -y --no-install-recommends $pkgs; }
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Fails when a dependency ships no license text we can put in the release.
      - name: Third-party licenses
        run: python3 scripts/third-party-licenses.py -o "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt"
