name: AUR

# Publishing a release (not just drafting it) updates both AUR packages: prostir-bin
# (the release's prebuilt program) and prostir (built from the tagged source). Needs the
# repository secret AUR_SSH_KEY: a private key whose public half is added to the AUR
# account that owns both packages.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.1.0
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  aur:
    strategy:
      fail-fast: false
      matrix:
        package: [prostir-bin, prostir]
    runs-on: ubuntu-24.04
    # A stuck mirror or runner fails the job instead of holding it for hours. The
    # source package is built once here to prove it builds (a few minutes).
    timeout-minutes: 40
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: PKGBUILD for this release
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git openssh
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          version="${TAG#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::Tag $TAG does not match version $cargo_version in Cargo.toml of this checkout"
            exit 1
          fi
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          mkdir -p /tmp/dl /tmp/aur
          curl -fL --retry 3 -o /tmp/dl/SHA256SUMS "$base/SHA256SUMS"
          # SHA-256 of an empty file: a download that produced nothing.
          empty=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          # A release file, checked against the release's SHA256SUMS; prints its sum.
          fetch_release_file() {
            curl -fL --retry 3 -o "/tmp/dl/$1" "$base/$1"
            (cd /tmp/dl && awk -v f="$1" '$2 == f' SHA256SUMS | grep . | sha256sum -c - >&2)
            sha256sum "/tmp/dl/$1" | cut -d' ' -f1
          }
          if [ "$PACKAGE" = prostir-bin ]; then
            tarball="prostir-${version}-x86_64-linux.tar.gz"
            sum="$(fetch_release_file "$tarball")"
            tar -tzf "/tmp/dl/$tarball" "prostir-${version}-x86_64-linux/prostir" >/dev/null
            sed -e "s/@VERSION@/${version}/" -e "s/@SHA256@/${sum}/" \
              packaging/aur/prostir-bin/PKGBUILD.in > /tmp/aur/PKGBUILD
          else
            licenses="$(fetch_release_file THIRD-PARTY-LICENSES.txt)"
            curl -fL --retry 3 -o /tmp/dl/source.tar.gz \
              "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
            sum="$(sha256sum /tmp/dl/source.tar.gz | cut -d' ' -f1)"
            tar -tzf /tmp/dl/source.tar.gz "prostir-${version}/Cargo.lock" >/dev/null
            sed -e "s/@VERSION@/${version}/" -e "s/@SOURCE_SHA256@/${sum}/" \
              -e "s/@LICENSES_SHA256@/${licenses}/" \
              packaging/aur/prostir/PKGBUILD.in > /tmp/aur/PKGBUILD
          fi
          if [ "$sum" = "$empty" ]; then
            echo "::error::the download for $PACKAGE is empty"
            exit 1
          fi
          useradd -m builder
          chown -R builder /tmp/aur
          # Checks the checksums in the PKGBUILD against fresh downloads.
          su builder -c "cd /tmp/aur && makepkg --verifysource && makepkg --printsrcinfo > .SRCINFO"
          if [ "$PACKAGE" = prostir ]; then
            # Build it once, tests included, so a source package that does not build is
            # never published.
            deps="$(cd /tmp/aur && bash -c 'source PKGBUILD; echo "${depends[@]} ${makedepends[@]}"')"
            pacman -S --noconfirm --needed $deps
            su builder -c "cd /tmp/aur && makepkg --noconfirm"
          fi
          (cd /tmp/aur && rm -rf src pkg ./*.tar.gz ./*.txt ./*.pkg.tar.*)
          cat /tmp/aur/PKGBUILD /tmp/aur/.SRCINFO
      - name: Push to the AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "AUR_SSH_KEY is not set; skipping the push."
            exit 0
          fi
          mkdir -p ~/.ssh
          trap 'rm -f ~/.ssh/aur' EXIT
          (umask 077 && printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur)
          # The AUR's published host key (https://aur.archlinux.org, SSH fingerprints:
          # Ed25519 SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4).
          echo "aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN" > ~/.ssh/known_hosts
          # In the container $HOME is /github/home, but ssh looks in root's own home: name
          # both files outright.
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          # The first push of a new name creates the package on the AUR.
          git clone "ssh://aur@aur.archlinux.org/${PACKAGE}.git" /tmp/repo
          cp /tmp/aur/PKGBUILD /tmp/aur/.SRCINFO /tmp/repo/
          cd /tmp/repo
          git config user.name "Prostir release bot"
          git config user.email "prostir-release@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${TAG#v}" || { echo "Nothing to update."; exit 0; }
          git push origin HEAD:master
