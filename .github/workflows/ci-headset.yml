name: CI headset

# The headset app and the shared protocol, when either changed: its desktop-buildable
# parts tested on the desktop, the whole app checked for Android. The APK itself is
# built by release.yml for a tag.
on:
  push:
    branches: [main, "dev/**"]
    paths:
      - "crates/prostir-client/**"
      - "crates/prostir-proto/**"
      - "crates/prostir-layout/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-headset.yml"
  pull_request:
    paths:
      - "crates/prostir-client/**"
      - "crates/prostir-proto/**"
      - "crates/prostir-layout/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-headset.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt -p prostir-client --check
      - run: cargo clippy -p prostir-client --all-targets --locked -- -D warnings
      - run: cargo test -p prostir-client --locked

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy for the headset
        run: |
          TC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android32-clang"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android32-clang"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          cargo clippy -p prostir-client --target aarch64-linux-android --locked -- -D warnings
