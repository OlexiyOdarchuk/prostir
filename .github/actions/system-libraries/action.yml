name: System libraries
description: Installs Ubuntu packages from the main Ubuntu archive.

inputs:
  packages:
    description: Packages to install, separated by spaces.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        # The runner's mirror list puts a regional mirror first, and when it does not
        # answer apt waits on every file before trying the next one (half an hour on
        # 2026-11-19). The main archive answers.
        for sources in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
          if [ -f "$sources" ]; then
            sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g' "$sources"
          fi
        done
        apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
        $apt update
        # shellcheck disable=SC2086 # one word per package
        $apt install -y --no-install-recommends $PACKAGES
