# What the headset's core (the model, its rules, what the menu shows) must not call:
# it is tested on the desktop with time as a parameter, and nothing in it waits,
# starts threads or touches files. The shell (OpenXR, Android, the network, the
# selftest, the writer of files) lifts these for a whole module with
# #[expect(clippy::disallowed_methods, reason = "...")]; the core does not. Until the
# files' writer takes them over, each file call of the core carries an expect of its
# own, and once it is gone the expect itself fails, so none is forgotten.
disallowed-methods = [
    { path = "std::time::Instant::now", reason = "the core takes the time as a parameter, read once per pass of the loop" },
    { path = "std::time::Instant::elapsed", reason = "reads the time too: compare with the time passed in" },
    { path = "std::time::SystemTime::now", reason = "the clock for the menu comes in as a parameter" },
    { path = "std::thread::sleep", reason = "the core never waits" },
    { path = "std::thread::spawn", reason = "threads belong to the shell" },
    { path = "std::thread::Builder::spawn", reason = "threads belong to the shell" },
    { path = "std::fs::read", reason = "files are read and written by the files' writer and the network thread only" },
    { path = "std::fs::read_to_string", reason = "files are read and written by the files' writer and the network thread only" },
    { path = "std::fs::write", reason = "files are read and written by the files' writer and the network thread only" },
    { path = "std::fs::rename", reason = "files are read and written by the files' writer and the network thread only" },
    { path = "std::fs::remove_file", reason = "files are read and written by the files' writer and the network thread only" },
    { path = "std::fs::File::open", reason = "files are read and written by the files' writer and the network thread only" },
    { path = "std::fs::File::create", reason = "files are read and written by the files' writer and the network thread only" },
    { path = "std::fs::OpenOptions::open", reason = "files are read and written by the files' writer and the network thread only" },
    { path = "prostir_proto::secure::write_atomic", reason = "writes a file, with fsync: the files' writer and the network thread only" },
    { path = "prostir_proto::secure::TrustStore::load", reason = "reads the trusted PCs' file: the network thread only" },
]
