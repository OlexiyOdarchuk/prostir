[package]
name = "prostir-host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Prostir host: virtual KDE Plasma monitors streamed to a Meta Quest headset"

[[bin]]
name = "prostir"
path = "src/main.rs"

[[bin]]
name = "prostir-probe"
path = "src/bin/probe.rs"

[dependencies]
prostir-proto = { path = "../proto" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
libc = "0.2"
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
wayland-client = "0.31"
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[[bin]]
name = "prostir-mirrortest"
path = "src/bin/mirrortest.rs"
