[package]
name = "prostir-host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Prostir host: virtual KDE Plasma monitors streamed to a Meta Quest headset"

[[bin]]
name = "prostir"
path = "src/main.rs"

# Development tool: connects like a headset and saves what the PC sends.
# Not part of releases.
[[bin]]
name = "prostir-probe"
path = "src/bin/probe.rs"

[dependencies]
prostir-proto = { path = "../proto" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
libc = "0.2"
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
wayland-client = "0.31"
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

# Packages built in the release workflow: `cargo deb -p prostir-host` and
# `cargo generate-rpm -p host`. Same files as scripts/install.sh puts in ~/.local.
[package.metadata.deb]
name = "prostir"
maintainer = "Prostir contributors <https://github.com/OlexiyOdarchuk/prostir>"
section = "utils"
priority = "optional"
extended-description = """\
Prostir puts extra monitors for a KDE Plasma desktop into a Meta Quest 3 headset. \
They are real KWin outputs, streamed to the headset over Wi-Fi or USB. This package \
is the PC part; the headset app comes as an APK from the same release."""
depends = "$auto, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-pipewire, gstreamer1.0-pulseaudio, pipewire-bin, kscreen, curl"
recommends = "kdialog | zenity, libnotify-bin, qdbus-qt6, adb"
assets = [
    ["target/release/prostir", "usr/bin/", "755"],
    ["../packaging/prostir.desktop", "usr/share/applications/", "644"],
    ["../packaging/prostir.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../README.md", "usr/share/doc/prostir/README.md", "644"],
    ["../LICENSE-EXCEPTION.md", "usr/share/doc/prostir/LICENSE-EXCEPTION.md", "644"],
]

[package.metadata.generate-rpm]
name = "prostir"
summary = "Extra KDE Plasma monitors in a Meta Quest 3 headset"
license = "GPL-3.0-or-later"
assets = [
    { source = "target/release/prostir", dest = "/usr/bin/prostir", mode = "755" },
    { source = "../packaging/prostir.desktop", dest = "/usr/share/applications/prostir.desktop", mode = "644" },
    { source = "../packaging/prostir.svg", dest = "/usr/share/icons/hicolor/scalable/apps/prostir.svg", mode = "644" },
    { source = "../README.md", dest = "/usr/share/doc/prostir/README.md", mode = "644", doc = true },
    { source = "../LICENSE-EXCEPTION.md", dest = "/usr/share/licenses/prostir/LICENSE-EXCEPTION.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
gstreamer1-plugins-good = "*"
gstreamer1-plugins-bad-free = "*"
pipewire-gstreamer = "*"
pipewire-utils = "*"
kscreen = "*"
curl = "*"
